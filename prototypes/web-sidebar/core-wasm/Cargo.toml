# PROTOTYPE - throwaway. A wasm shim over andamento-core for the browser
# sidebar prototype (wheelhouse#428). Not part of the workspace.
[package]
name = "andamento-web-proto"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
andamento-core = { path = "../../../crates/andamento-core" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

