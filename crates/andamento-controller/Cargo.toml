[package]
name = "andamento-controller"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "andamento_controller"
path = "src/main.rs"

[[bin]]
name = "andamento-controller"
path = "src/main.rs"

[features]
native-plugin-factory = []

[dependencies]
log = "0.4"
serde.workspace = true
serde_json.workspace = true
andamento-shared.workspace = true
zellij-tile.workspace = true

# Native-only: the render harness (`cargo run -p andamento-controller -- <patches>`)
# renders derived rows through the real rail renderer. Not linked into the wasm plugin.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
andamento-rail.workspace = true

[dev-dependencies]
insta.workspace = true
