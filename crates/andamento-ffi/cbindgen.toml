# include/andamento_documents.h, generated from src/documents.rs alone
# (scripts/generate-header.sh). andamento.h includes it after the types it
# names, so it includes nothing itself.
language = "C"
include_guard = "ANDAMENTO_DOCUMENTS_H"
autogen_warning = "/* Generated by cbindgen from crates/andamento-ffi/src/documents.rs; do not edit. */"
no_includes = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true

[export.rename]
"Text" = "AndamentoText"
"Bytes" = "AndamentoBytes"
"WorkspaceIdView" = "AndamentoWorkspaceId"
