name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ZELLIJ_REVISION: d262df58ebdea2549666a5060663d017545bb5cb

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rjwittams/zellij
          ref: ${{ env.ZELLIJ_REVISION }}
          path: zellij
      - name: Link sibling Zellij dependency
        run: ln -s "$GITHUB_WORKSPACE/zellij" "$(dirname "$GITHUB_WORKSPACE")/zellij"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: >-
          cargo fmt --check
          --package andamento
          --package andamento-shared
          --package andamento-controller
          --package andamento-rail
          --package andamento-config

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rjwittams/zellij
          ref: ${{ env.ZELLIJ_REVISION }}
          path: zellij
      - name: Link sibling Zellij dependency
        run: ln -s "$GITHUB_WORKSPACE/zellij" "$(dirname "$GITHUB_WORKSPACE")/zellij"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --workspace --target wasm32-wasip1 --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rjwittams/zellij
          ref: ${{ env.ZELLIJ_REVISION }}
          path: zellij
      - name: Link sibling Zellij dependency
        run: ln -s "$GITHUB_WORKSPACE/zellij" "$(dirname "$GITHUB_WORKSPACE")/zellij"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: >-
          cargo test --target x86_64-unknown-linux-gnu --lib --locked
          -p andamento-shared
          -p andamento-controller
          -p andamento-config
          -p andamento-rail

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rjwittams/zellij
          ref: ${{ env.ZELLIJ_REVISION }}
          path: zellij
      - name: Link sibling Zellij dependency
        run: ln -s "$GITHUB_WORKSPACE/zellij" "$(dirname "$GITHUB_WORKSPACE")/zellij"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      - run: cargo build --workspace --target wasm32-wasip1 --release --locked -j1
