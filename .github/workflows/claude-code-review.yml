name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and Rust best practices
            - Potential bugs or regressions
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository documentation for guidance on architecture,
            style, and conventions. Be constructive and specific.

            After reviewing:
            - Check your findings against the existing comments and replies on
              the PR. Drop findings that are already addressed, and repeat
              findings that still need work with an explanation.
            - Always use `gh pr comment` with your Bash tool to leave the review
              as a single Markdown comment, even if no issues were found.
          claude_args: >-
            --allowed-tools
            "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
