name: Publish fleet artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
  FORGEJO_PACKAGE_OWNER: robert
  FORGEJO_PACKAGE_NAME: andamento
  ZELLIJ_REVISION: d262df58ebdea2549666a5060663d017545bb5cb

jobs:
  wasm:
    name: WASM plugin trio
    runs-on: feta
    timeout-minutes: 45
    steps:
      - name: Verify fleet runner
        run: |
          test "$(hostname -s)" = feta
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Check out source
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Prepare pinned Zellij dependency
        run: |
          git init zellij
          git -C zellij remote add origin https://github.com/rjwittams/zellij.git
          git -C zellij fetch --depth 1 origin "$ZELLIJ_REVISION"
          git -C zellij checkout --detach FETCH_HEAD
          sibling_zellij="$PWD/../zellij"
          if test -L "$sibling_zellij"; then
            rm "$sibling_zellij"
          elif test -e "$sibling_zellij"; then
            echo "refusing to replace non-symlink sibling: $sibling_zellij" >&2
            exit 1
          fi
          ln -s "$PWD/zellij" "$sibling_zellij"

      - name: Build release plugins
        run: |
          rustup target add wasm32-wasip1 --toolchain stable
          cargo +stable build --workspace --target wasm32-wasip1 --release --locked -j1

      - name: Stage and describe artifacts
        env:
          COMMIT_SHA: ${{ forgejo.sha }}
        run: |
          mkdir -p dist
          for plugin in andamento-controller andamento-rail andamento-config; do
            install -m 0644 \
              "target/wasm32-wasip1/release/${plugin}.wasm" \
              "dist/${plugin}-wasm32-wasip1.wasm"
            test -s "dist/${plugin}-wasm32-wasip1.wasm"
            scripts/write-artifact-metadata.sh \
              "dist/${plugin}-wasm32-wasip1.wasm" \
              "dist/${plugin}-wasm32-wasip1.wasm.json" \
              flotilla-org/andamento "$COMMIT_SHA" wasm32-wasip1 "" false
          done

      - name: Publish immutable package version
        env:
          FORGEJO_PACKAGE_VERSION: ${{ forgejo.sha }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: scripts/publish-forgejo-generic.sh dist/*
